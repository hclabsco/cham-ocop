name: deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Owner budget: CI 2 minutes; a push to main also deploys, so the whole run is the CD phase (1 minute).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 2 || 1 }}
    steps:
      - uses: actions/checkout@v4
      # Reads the version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      # postbuild runs scripts/check-dist.mjs: no external resource on any page.
      - run: pnpm build

      - name: Deploy cham-ocop
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # hclabs.co has Bot Fight Mode on, which answers 403 to GitHub runner IPs;
      # workers.dev serves the same Worker version without that zone setting.
      - name: Smoke test production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          base=https://cham-ocop.ch-nh.workers.dev
          # A new version can take a few seconds to reach every edge: retry non-200 briefly.
          for path in / /cham/che-tuoi-che-che-bien/ /han-giay-chung-nhan/ /nguon/; do
            for _ in 1 2 3 4 5; do
              code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' "$base$path")
              [ "$code" = 200 ] && break
              sleep 2
            done
            echo "$path -> $code"
            [ "$code" = 200 ]
          done
          curl -s --max-time 5 --retry 3 "$base/cham/che-tuoi-che-che-bien/" | grep -q 'Chè tươi, chè chế biến'

      # Job timeouts bound each job; this bounds the whole run, queue time included.
      - name: Whole phase stays within budget
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET: ${{ github.event_name == 'pull_request' && 120 || 60 }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "elapsed ${elapsed}s, budget ${BUDGET}s"
          [ "$elapsed" -le "$BUDGET" ]
